# zuhairhd.com — موقع ثابت مستقل. لا تجعله default_server.
# هذه هي النسخة الفعلية على الخادم بعد certbot (الشهادة: /etc/letsencrypt/live/zuhairhd.com).
# النطاق الأساسي zuhairhd.com؛ www وHTTP يُحوَّلان إليه بـ 301.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name zuhairhd.com;

    root /var/www/zuhairhd.com;
    index index.html;
    charset utf-8;

    location / {
        try_files $uri $uri/ =404;
    }
    error_page 404 /404.html;

    # add_header داخل location يلغي الموروث من server، لذا تُكرَّر رؤوس الأمان هنا.
    location /assets/ {
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # بدون includeSubDomains: vpn.zuhairhd.com على خادم آخر وليس HTTPS.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/zuhairhd.com.access.log;
    error_log  /var/log/nginx/zuhairhd.com.error.log;

    ssl_certificate /etc/letsencrypt/live/zuhairhd.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/zuhairhd.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# www → النطاق الأساسي
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.zuhairhd.com;

    add_header Strict-Transport-Security "max-age=31536000" always;
    return 301 https://zuhairhd.com$request_uri;

    access_log /var/log/nginx/zuhairhd.com.access.log;
    error_log  /var/log/nginx/zuhairhd.com.error.log;

    ssl_certificate /etc/letsencrypt/live/zuhairhd.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/zuhairhd.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# HTTP → HTTPS على النطاق الأساسي
server {
    listen 80;
    listen [::]:80;
    server_name zuhairhd.com www.zuhairhd.com;
    return 301 https://zuhairhd.com$request_uri;
}
