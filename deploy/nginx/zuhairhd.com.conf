# zuhairhd.com — موقع ثابت مستقل. لا تجعله default_server.
# certbot --nginx سيضيف كتلة 443 والتحويل إلى HTTPS تلقائياً.
server {
    listen 80;
    listen [::]:80;
    server_name zuhairhd.com www.zuhairhd.com;

    root /var/www/zuhairhd.com;
    index index.html;
    charset utf-8;

    location / {
        try_files $uri $uri/ =404;
    }
    error_page 404 /404.html;

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/zuhairhd.com.access.log;
    error_log  /var/log/nginx/zuhairhd.com.error.log;
}
